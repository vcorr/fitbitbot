name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
env:
  PROJECT_ID: ai-coach-485409
  REGION: europe-north1
  SERVICE: fitbit-api

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
            
      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and push container
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE packages/api
          docker push gcr.io/$PROJECT_ID/$SERVICE            

      - name: Get Cloud Run service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe $SERVICE --region $REGION --project $PROJECT_ID --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          SERVICE_URL="${{ steps.service-url.outputs.url }}"
          gcloud run deploy $SERVICE \
            --image gcr.io/$PROJECT_ID/$SERVICE \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,MCP_SERVER_URL=$SERVICE_URL" \
            --set-secrets="CLIENT_ID=fitbit-client-id:latest,CLIENT_SECRET=fitbit-client-secret:latest,FITBIT_TOKEN=fitbit-token:latest,API_KEY=fitbit-api-key:latest,MCP_AUTH_PASSWORD=mcp-auth-password:latest"
